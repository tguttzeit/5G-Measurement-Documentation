<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>API reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: sans-serif; }
    .missing { padding: 1.5rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="redoc"></div>
  <script type="module">
    // openapi.json is generated by scripts/build_i18n.py from the backend sources; Redoc
    // (MIT, vendored as redoc.standalone.js, see redoc.LICENSE.txt) renders it.
    import { init } from "./redoc.standalone.js";
    const target = document.getElementById("redoc");
    fetch("openapi.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((spec) => init(spec, { hideDownloadButton: false }, target))
      .catch(() => {
        target.className = "missing";
        target.textContent =
          "The API reference was not generated for this build (backend sources not available). " +
          "The running backend serves its own version under /api/docs.";
      });
  </script>
</body>
</html>
