site_description = "Nutzung, Wartung und Entwicklung der 5G-Messeinheit der Technischen Hochschule Augsburg"
site_url = "https://docs.example.org/"
copyright = "Technische Hochschule Augsburg"

repo_url = "https://github.com/tguttzeit/5G-Measurement-Software"
repo_name = "5G-Measurement-Software"
extra_css = ["stylesheets/tha.css", "stylesheets/flugplanung.css"]

